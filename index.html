<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gastos Personales</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1e3a8a; margin-top: 0; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; transition: border-color 0.3s; }
        input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        button { width: 100%; background-color: #2563eb; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #mensaje-exito { display: none; margin-top: 20px; text-align: center; color: #16a34a; font-weight: bold; background: #dcfce7; padding: 12px; border-radius: 6px; }
        #mensaje-error { display: none; margin-top: 20px; text-align: center; color: #dc2626; font-weight: bold; background: #fee2e2; padding: 12px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>?? Mis Finanzas</h2>
        <form id="formGasto">
            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" name="descripcion" placeholder="Ej. Almuerzo, Compras, Taxi..." required>
            </div>
            
            <div class="form-group">
                <label for="categoria">Categoría:</label>
                <select id="categoria" name="categoria" required>
                   <option value="">Selecciona...</option>
                   <option value="Alimentación">Alimentación</option>
                   <option value="Transporte">Transporte</option>
                   <option value="Servicios">Servicios / Casa</option>
                   <option value="Entretenimiento">Entretenimiento</option>
                   <option value="Salario / Ingreso">Salario / Ingreso</option>
                   <option value="Otros">Otros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo:</label>
                <select id="tipo" name="tipo" required>
                   <option value="Gasto">Gasto ??</option>
                   <option value="Ingreso">Ingreso ??</option>
                </select>
            </div>

            <div class="form-group">
                <label for="monto">Monto:</label>
                <input type="number" step="0.01" min="0.01" id="monto" name="monto" placeholder="0.00" required>
            </div>

            <button type="submit" id="btnGuardar">Registrar Movimiento</button>
        </form>
        <div id="mensaje-exito">¡Movimiento guardado con éxito en Google Sheets! ??</div>
        <div id="mensaje-error">Hubo un error al registrar el movimiento. Inténtalo de nuevo.</div>
    </div>

    <script>
        // URL configurada de Google Apps Script
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyUaeZ7qJD0MfdeIgx3IYvBPyRyXtHnxhVfp2_fR7FHtaQEbQXbtjguJDufPBhyBqAq6g/exec';

        const form = document.getElementById('formGasto');
        const btnGuardar = document.getElementById('btnGuardar');
        const mensajeExito = document.getElementById('mensaje-exito');
        const mensajeError = document.getElementById('mensaje-error');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btnGuardar.disabled = true;
            btnGuardar.textContent = "Guardando...";
            mensajeExito.style.display = 'none';
            mensajeError.style.display = 'none';

            const requestBody = {
                descripcion: document.getElementById('descripcion').value,
                categoria: document.getElementById('categoria').value,
                tipo: document.getElementById('tipo').value,
                monto: document.getElementById('monto').value
            };

            fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify(requestBody),
                mode: 'no-cors' 
            })
            .then(() => {
                mensajeExito.style.display = 'block';
                form.reset();
                btnGuardar.disabled = false;
                btnGuardar.textContent = "Registrar Movimiento";
                setTimeout(() => { mensajeExito.style.display = 'none'; }, 4000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                mensajeError.style.display = 'block';
                btnGuardar.disabled = false;
                btnGuardar.textContent = "Registrar Movimiento";
                setTimeout(() => { mensajeError.style.display = 'none'; }, 4000);
            });
        });
    </script>
</body>
</html>
