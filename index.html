<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gastos Personales</title>
    <!-- Google Fonts para una tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        .container { 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 460px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 { 
            color: var(--text-main); 
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 8px 0; 
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .form-group { 
            margin-bottom: 18px; 
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 0.875rem;
            color: var(--text-main); 
        }

        input, select { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1.5px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 0.95rem; 
            color: var(--text-main);
            background-color: #fff;
            transition: all 0.2s ease; 
        }

        input:hover, select:hover {
            border-color: #cbd5e1;
        }

        input:focus, select:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px var(--primary-light); 
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-icon-wrapper input {
            padding-left: 28px;
        }

        button { 
            width: 100%; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 13px; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.2s ease, transform 0.1s ease; 
            margin-top: 8px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover { 
            background-color: var(--primary-hover); 
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled { 
            background-color: #cbd5e1; 
            cursor: not-allowed; 
            transform: none;
        }

        .alert {
            display: none; 
            margin-top: 20px; 
            text-align: center; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 0.875rem;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        #mensaje-exito { 
            color: var(--success-text); 
            background: var(--success-bg); 
            border: 1px solid #bbf7d0;
        }

        #mensaje-error { 
            color: var(--error-text); 
            background: var(--error-bg); 
            border: 1px solid #fecaca;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>💸 Mis Finanzas</h2>
            <p>Registra tus ingresos y gastos de forma rápida</p>
        </div>
        
        <form id="formGasto">
            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion" placeholder="Ej. Almuerzo, Supermercado, Taxi..." required>
            </div>
            
            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                   <option value="" disabled selected>Selecciona una categoría...</option>
                   <option value="Alimentación">Alimentación</option>
                   <option value="Transporte">Transporte</option>
                   <option value="Servicios">Servicios / Casa</option>
                   <option value="Entretenimiento">Entretenimiento</option>
                   <option value="Salario / Ingreso">Salario / Ingreso</option>
                   <option value="Otros">Otros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de Movimiento</label>
                <select id="tipo" name="tipo" required>
                   <option value="Gasto">Gasto 📉</option>
                   <option value="Ingreso">Ingreso 📈</option>
                </select>
            </div>

            <div class="form-group">
                <label for="monto">Monto</label>
                <div class="input-icon-wrapper">
                    <span>$</span>
                    <input type="number" step="0.01" min="0.01" id="monto" name="monto" placeholder="0.00" required>
                </div>
            </div>

            <button type="submit" id="btnGuardar">
                <span>Registrar Movimiento</span>
            </button>
        </form>
        
        <div id="mensaje-exito" class="alert">¡Movimiento guardado con éxito en Google Sheets! ✅</div>
        <div id="mensaje-error" class="alert">Hubo un error al registrar el movimiento. Inténtalo de nuevo. ❌</div>
    </div>

    <script>
        // URL configurada de Google Apps Script
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyUaeZ7qJD0MfdeIgx3IYvBPyRyXtHnxhVfp2_fR7FHtaQEbQXbtjguJDufPBhyBqAq6g/exec';

        const form = document.getElementById('formGasto');
        const btnGuardar = document.getElementById('btnGuardar');
        const mensajeExito = document.getElementById('mensaje-exito');
        const mensajeError = document.getElementById('mensaje-error');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btnGuardar.disabled = true;
            btnGuardar.querySelector('span').textContent = "Guardando...";
            mensajeExito.style.display = 'none';
            mensajeError.style.display = 'none';

            const requestBody = {
                descripcion: document.getElementById('descripcion').value,
                categoria: document.getElementById('categoria').value,
                tipo: document.getElementById('tipo').value,
                monto: document.getElementById('monto').value
            };

            fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify(requestBody),
                mode: 'no-cors' 
            })
            .then(() => {
                mensajeExito.style.display = 'block';
                form.reset();
                btnGuardar.disabled = false;
                btnGuardar.querySelector('span').textContent = "Registrar Movimiento";
                setTimeout(() => { mensajeExito.style.display = 'none'; }, 4000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                mensajeError.style.display = 'block';
                btnGuardar.disabled = false;
                btnGuardar.querySelector('span').textContent = "Registrar Movimiento";
                setTimeout(() => { mensajeError.style.display = 'none'; }, 4000);
            });
        });
    </script>
</body>
</html>
